name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o roadvanta-project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd roadvanta && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Roadvanta-APK
          path: roadvanta/app/build/outputs/apk/debug/*.apk
